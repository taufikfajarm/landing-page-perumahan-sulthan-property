name: Deploy via SSH (Build on GitHub, Extract on Server)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, hash, libxml, openssl
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ⚡ Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: 📦 Archive release files
        run: |
          zip -r deploy.zip . -x "node_modules/*" ".git/*" ".github/*" "tests/*"

      - name: 📁 Copy archive to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy.zip"
          target: ${{ secrets.SSH_TARGET_DIR }}

      - name: 🔑 Extract archive & Run Laravel commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.SSH_TARGET_DIR }}
            
            # Extract deployment package
            unzip -o deploy.zip
            rm deploy.zip
            
            # Run migrations (Force because we are in production)
            php artisan migrate --force
            
            # Clear and optimize configuration caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
